<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings – Mapúa Inventory</title>

  <!-- Palette variables -->
  <!-- Global CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
  <!-- Page‐specific CSS -->
  <link rel="stylesheet" href="settings.css" />
  <!-- Page‐specific JS -->
  <script defer src="settings.js"></script>
</head>
<body>
  <!-- Floating clock placeholder -->
  <div id="floating-time" class="floating-time"></div>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <!-- Profile header -->
    <div class="sidebar-profile">
      <div class="avatar"></div>
      <div class="user-name"></div>
    </div>

    <!-- Navigation -->
   <nav class="sidebar-nav">
  <ul>
    <li><a href="dashboard.html"><span class="icon">📊</span><span class="label">Dashboard</span></a></li>
    <li><a href="rfid.html"><span class="icon">🏷️</span><span class="label">RFID</span></a></li> 
    <li><a href="tracking.html"><span class="icon">📦</span><span class="label">Item Tracking</span></a></li>
    <li><a href="rooms.html"><span class="icon">🏠</span><span class="label">Rooms</span></a></li>
    <li><a href="assets.html"><span class="icon">💻</span><span class="label">Assets</span></a></li>
    <li><a href="reports.html"><span class="icon">📑</span><span class="label">Reports</span></a></li>
    <li class="active"><a href="settings.html"><span class="icon">⚙️</span><span class="label">Settings</span></a></li>
    <li>
      <a href="users.html">
        <span class="icon">🧑</span>
        <span class="label">Users</span>
      </a>
    </li>
  </ul>
</nav>

    <!-- Footer buttons -->
    <div class="sidebar-footer">

      <button id="signout-btn">🔒 Sign Out</button>
    </div>
  </aside>



  <div class="main-content">
    <header class="header toolbar">
      <h2>Profile Settings</h2>
      <div class="user-menu"><span class="username">Admin</span></div>
      <button class="theme-toggle-btn" title="Toggle theme">🌙</button>
      <div class="avatar">AD</div>
    </header>

    <main>
      <section class="profile-form">
        <form id="profileForm">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text"
                   id="firstName"
                   name="firstName"
                   placeholder="Your first name"
                   required />
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text"
                   id="lastName"
                   name="lastName"
                   placeholder="Your last name"
                   required />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="you@company.com"
                   required />
          </div>

          <div class="form-group">
            <label for="contactNo">Contact No.</label>
            <input type="tel"
                   id="contactNo"
                   name="contactNo"
                   placeholder="+63 912 345 6789" />
          </div>

          <div class="form-buttons">
            <button type="button" id="cancelBtn" class="btn-light">Cancel</button>
            <button type="submit" id="saveBtn" class="btn-primary">Save Changes</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
