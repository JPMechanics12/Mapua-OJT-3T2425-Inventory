<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rooms Monitor – Mapua Inventory</title>

  <!-- Fonts + global styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="rooms.css" />
  <script defer src="rooms.js"></script>
</head>
<body>
  <!-- Floating clock -->
  <div id="floating-time" class="floating-time"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-profile">
      <div class="avatar"></div>
      <div class="user-name"></div>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="dashboard.html"><span class="icon">📊</span><span class="label">Dashboard</span></a></li>
        <li><a href="rfid.html"><span class="icon">🏷️</span><span class="label">RFID</span></a></li>
        <li><a href="tracking.html"><span class="icon">📦</span><span class="label">Item Tracking</span></a></li>
        <li class="active"><a href="rooms.html"><span class="icon">🏠</span><span class="label">Rooms</span></a></li>
        <li><a href="assets.html"><span class="icon">💻</span><span class="label">Assets</span></a></li>
        <li><a href="reports.html"><span class="icon">📑</span><span class="label">Reports</span></a></li>
        <li><a href="settings.html"><span class="icon">⚙️</span><span class="label">Settings</span></a></li>
        <li><a href="users.html"><span class="icon">🧑</span><span class="label">Users</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button id="signout-btn">🔒 Sign Out</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <!-- Header toolbar -->
    <header class="header toolbar">
      <h2>Rooms Monitor</h2>
      <div class="user-menu"><span class="username">Admin</span></div>
      <button class="theme-toggle-btn" title="Toggle theme">🌙</button>
      <div class="avatar">AD</div>
    </header>

    <main>
      <!-- Redesigned room toolbar -->
      <section class="room-toolbar">
        <div class="rt-left">
          <h3 class="rt-title">Room</h3>

          <label class="rt-select">
            <select id="room-select" aria-label="Select room">
              <option value="">— Choose a room —</option>
            </select>
            <span class="chev">▾</span>
          </label>

          <button id="bulkCheck" class="rt-btn rt-primary">Check All</button>

          <button id="addRoomBtn" class="rt-btn rt-dashed">
            <span class="plus">+</span> Add Room
          </button>
        </div>

        <ul class="rt-legend">
          <li><span class="dot ok"></span> Working</li>
          <li><span class="dot bad"></span> Defective</li>
        </ul>
      </section>

      <!-- PC grid -->
      <section class="pc-grid"></section>
    </main>
  </div>

  <!-- Defect modal -->
  <div id="defectModal" class="modal hidden">
    <div class="modal-content">
      <h3>Select Issue(s)</h3>
      <form id="defectForm">
        <div class="issues-list">
          <label><input type="checkbox" name="issues" value="Mouse"> Mouse</label>
          <label><input type="checkbox" name="issues" value="Keyboard"> Keyboard</label>
          <label><input type="checkbox" name="issues" value="Monitor"> Monitor</label>
          <label><input type="checkbox" name="issues" value="Operating System"> OS</label>
          <label><input type="checkbox" name="issues" value="Memory"> Memory</label>
          <label><input type="checkbox" name="issues" value="CPU"> CPU</label>
          <label><input type="checkbox" name="issues" value="GPU"> GPU</label>
          <label><input type="checkbox" name="issues" value="Network"> Network</label>

          <label>
            <input type="checkbox" id="issue-other-checkbox" name="issues" value="Other">
            Other
          </label>
          <div class="other-input-wrapper hidden">
            <input
              type="text"
              id="issue-other-text"
              name="otherIssue"
              class="other-input"
              placeholder="Describe other issue"
            />
          </div>
        </div>
        <div class="modal-buttons">
          <button type="button" id="defectCancel" class="btn-light">Cancel</button>
          <button type="submit" class="btn-primary">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fix modal -->
  <div id="fixModal" class="modal hidden">
    <div class="modal-content">
      <h3>Log a Fix</h3>
      <form id="fixForm" class="fix-form">
        <div class="form-group">
          <label for="fixDateTime">Fixed On</label>
          <input type="datetime-local" id="fixDateTime" name="fixedOn" required>
        </div>
        <div class="form-group">
          <label for="fixerInput">Fixed By</label>
          <input type="text" id="fixerInput" name="fixedBy" list="fixerList" placeholder="Type to search…" required />
          <datalist id="fixerList"></datalist>
        </div>
        <div class="modal-buttons">
          <button type="button" id="fixCancel" class="btn-light">Cancel</button>
          <button type="submit" class="btn-primary">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bulk-Fix modal -->
  <div id="bulkFixModal" class="modal hidden">
    <div class="modal-content">
      <h3>Log Bulk Fix</h3>
      <form id="bulkFixForm" class="fix-form">
        <div class="form-group">
          <label for="bulkFixDateTime">Fixed On</label>
          <input type="datetime-local" id="bulkFixDateTime" name="fixedOn" required/>
        </div>
        <div class="form-group">
          <label for="bulkFixerInput">Fixed By</label>
          <input type="text" id="bulkFixerInput" name="fixedBy" list="fixerList" placeholder="Type to search…" required/>
        </div>
        <div class="modal-buttons">
          <button type="button" id="bulkFixCancel" class="btn-light">Cancel</button>
          <button type="submit" class="btn-primary">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Room modal -->
  <div id="roomModal" class="modal hidden">
    <div class="modal-content">
      <h3>Add a Room</h3>
      <form id="roomForm" class="fix-form">
        <div class="form-group">
          <label for="roomID">Room ID</label>
          <input id="roomID" name="roomID" maxlength="10" placeholder="e.g. MPO312" required>
        </div>
        <div class="form-group">
          <label for="roomConfig">Configuration</label>
          <input type="number" id="roomConfig" name="roomConfig" min="1" value="1">
        </div>
        <div class="form-group">
          <label for="pcNum">Number of PCs</label>
          <input type="number" id="pcNum" name="pcNum" min="1" value="41">
        </div>
        <div class="modal-buttons">
          <button type="button" id="roomCancel" class="btn-light">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
